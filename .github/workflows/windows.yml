name: windows

on:
  push:
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build and test ${{matrix.build-type}}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
    env:
      VCVARS: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat

    steps:
      - name: Clone recursively
        uses: actions/checkout@v4
        with:
          repository: hsqStephenZhang/MimIR
          ref: feat/plugin-support-v2
          path: mimir
          submodules: recursive

      - name: Clone torch plugin
        uses: actions/checkout@v4
        with:
          path: mimir/extra/torch

      - name: Clone runtime plugin
        uses: actions/checkout@v4
        with:
          repository: hsqStephenZhang/mimir-runtime-plugin
          ref: feat/ll-emit
          path: mimir/extra/runtime

      - name: Install dependencies
        shell: cmd
        run: python -m pip install lit psutil

      - name: Install FileCheck
        uses: i3h/download-release-asset@v1
        with:
          owner: fodinabor
          repo: FileCheckBuild
          tag: llvmorg-22.1.8
          file: FileCheck-x86_64-win.exe
          path: mimir/bin
          token: ${{secrets.GITHUB_TOKEN}}

      # The MinGW FileCheck needs libstdc++-6.dll & co., no longer on bash's PATH since runner image
      # 20260706.237.1 (lit fails with exit code 127); stage them next to the exe.
      - name: Stage MinGW runtime DLLs
        shell: pwsh
        run: |
          foreach ($dll in 'libstdc++-6.dll', 'libgcc_s_seh-1.dll', 'libwinpthread-1.dll') {
              $src = (Get-Command $dll).Source
              Write-Host "$dll -> $src"
              Copy-Item $src "mimir\bin\"
          }

      - name: Verify FileCheck
        shell: bash
        run: |
          "$GITHUB_WORKSPACE/mimir/bin/FileCheck-x86_64-win.exe" --version

      # ccache is hooked via CMAKE_{C,CXX}_COMPILER_LAUNCHER (it cannot masquerade as cl.exe), which
      # requires /Z7 (Embedded) for Debug: ccache rejects /Zi and /ZI.
      - name: Setup ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          windows_compile_environment: msvc
          ccache_options: max_size=2G
          override_cache_key: ${{runner.os}}-ccache-${{matrix.build-type}}

      - name: Configure
        shell: cmd
        run: |
          call "%VCVARS%"
          set CC=cl.exe
          set CXX=cl.exe
          python -c "import sys; print(sys.executable)" > tmpPath
          set /p PYTHON_EXE= < tmpPath
          cmake -S mimir -B build -G Ninja                ^
                -DCMAKE_BUILD_TYPE=${{matrix.build-type}} ^
                -DCMAKE_C_COMPILER_LAUNCHER=ccache        ^
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache      ^
                -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=${{matrix.build-type == 'Debug' && 'Embedded' || ''}} ^
                -DBUILD_TESTING=ON                        ^
                -DMIM_BUILD_EXAMPLES=ON                   ^
                -DPython3_EXECUTABLE=%PYTHON_EXE%         ^
                -DPython_EXECUTABLE=%PYTHON_EXE%          ^
                -DPYTHON_EXECUTABLE=%PYTHON_EXE%          ^
                -DMIM_LIT_TIMEOUT=300                     ^
                -DMIM_FILECHECK=${{github.workspace}}/mimir/bin/FileCheck-x86_64-win.exe

      # After Configure on purpose: earlier, `find_program(NAMES clang)` would enable MIM_BUILD_LL_RUNTIME
      # on Windows. lit still needs clang on PATH.
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: "21.1.8"

      - name: Build
        shell: cmd
        run: |
          call "%VCVARS%"
          cmake --build build -v

      - name: Test
        shell: cmd
        run: |
          call "%VCVARS%"
          set PATH=mimir/bin;%PATH%
          cmake --build build -v --target test-all
